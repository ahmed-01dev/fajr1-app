name: build-android

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

- name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

- name: Flutter version
        run: flutter --version

- name: Pub get
        run: flutter pub get

- name: Verify Android Gradle files exist
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "::error::Missing android/app/build.gradle(.kts)"
            exit 1
          fi

- name: Analyze
        run: flutter analyze

- name: Tests
        run: flutter test

- name: Build release APK
        run: flutter build apk --release

- name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fajr-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

- name: Build release AAB
        run: flutter build appbundle --release

- name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fajr-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
