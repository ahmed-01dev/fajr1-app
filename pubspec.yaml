name: fajr
description: "فَجْر — تطبيق لمساعدة المسلمين على الاستيقاظ لصلاة الفجر عبر مجتمع موثوق."
publish_to: "none"
version: 0.1.0+1

environment:
  # Verified: Flutter 3.47.7 ships Dart 3.13.5 (checked live on 2026-10-21)
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase (unified 2026-10 major, verified on pub.dev) ──
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  cloud_functions: ^7.0.0

  # ── Local & platform ──
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  provider: ^6.1.2

  # ── Prayer times (verified: 2.0.0+1) ──
  adhan: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
